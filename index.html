<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- 修正⑥: maximum-scale=1, user-scalable=noを追加し、iOS Safariのピンチズーム／
       ダブルタップズーム自体を起こさないようにする。従来はtouch-guard.jsの
       suppressDoubleTapZoom()でダブルタップの2回目のtouchendだけをpreventDefault()して
       いたが、これは「監視対象の親要素配下」でしか効かず、監視対象外の要素（対局者名欄・
       盤面など）を連打された場合や、ピンチズーム（2本指操作）には無力だった。一度ズーム
       すると、iOS Safariの挙動として画面の大部分がズーム状態のままロックされ、リロード以外に
       解除手段がなくなる（このアプリは#scale-root自体でtransform: scale()による独自の
       拡縮を行っており、通常のページスクロールを前提としたズーム解除操作＝ダブルタップや
       ピンチアウトが正しく機能しない構造になっているため、ブラウザ標準のズーム解除に頼れない）。
       ズームという現象そのものをviewportレベルで止めるほうが、個別要素ごとにJSで
       ダブルタップを監視するより確実かつシンプル。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- PWA（ホーム画面追加）用の設定。
       theme-color はモバイルブラウザのアドレスバー色で、manifest.webmanifest の
       theme_color と一致させる（揃えないと起動時に色が切り替わって見える）。
       apple-touch-icon は iOS Safari の「ホーム画面に追加」用。iOS は manifest の
       アイコンを参照しないことが多く、この link が無いと画面上のスクリーンショット
       を代用アイコンにされてしまうため、正方形の専用アイコンを明示する。 -->
  <meta name="theme-color" content="#3a3a3a">
  <link rel="apple-touch-icon" href="./assets/icons/icon-180.png">
  <title>将棋 棋譜並べ</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div id="scale-root">
    <div id="app-frame">

      <!-- ①ヘッダー -->
      <header class="header">
        <button id="btn-hamburger" class="header-btn header-btn--hamburger" aria-label="メニュー">≡</button>
        <div class="header-buttons">
          <button id="btn-paste" class="header-btn">棋譜貼付</button>
          <button id="btn-load" class="header-btn">棋譜読込</button>
          <button id="btn-back-to-kifu" class="header-btn is-disabled" aria-disabled="true">分岐に戻る</button>
          <button id="btn-toggle-bar" class="header-btn">指手を非表示</button>
        </div>
      </header>

      <!-- ②棋譜符号バー -->
      <div id="kifu-bar" class="kifu-bar"></div>

      <!-- ③対戦相手情報＋持ち駒 -->
      <div class="player-info player-info--opponent">
        <div id="opponent-info-box" class="player-info-box">
          <span id="opponent-label" class="player-label"></span>
          <span id="opponent-name" class="player-name">後手</span>
        </div>
        <div id="opponent-hand" class="hand-pieces-container"></div>
      </div>

      <!-- ④盤面 -->
      <div id="board" class="board-container"></div>

      <!-- ⑤自分の情報＋持ち駒 -->
      <div class="player-info player-info--self">
        <div id="self-hand" class="hand-pieces-container"></div>
        <div id="self-info-box" class="player-info-box">
          <span id="self-label" class="player-label"></span>
          <span id="self-name" class="player-name">先手</span>
        </div>
      </div>

      <!-- ⑥下部操作列 -->
      <div class="bottom-controls">
        <button id="btn-flip" class="bottom-btn bottom-btn--flip">⇅反転</button>
        <div class="bottom-controls-group">
          <button id="btn-first" class="bottom-btn bottom-btn--compact" aria-label="最初">◀</button>
          <button id="btn-prev" class="bottom-btn bottom-btn--wide">＜前</button>
          <button id="btn-next" class="bottom-btn bottom-btn--wide is-disabled" aria-disabled="true">次＞</button>
          <button id="btn-last" class="bottom-btn bottom-btn--compact" aria-label="最後">▶</button>
        </div>
        <button id="btn-move-list" class="bottom-btn bottom-btn--movelist is-disabled" aria-disabled="true">手数選択</button>
      </div>

    </div>
  </div>

  <!-- ⑦ハンバーガーメニュー：ドロワー -->
  <div id="asset-drawer" class="asset-drawer"></div>
  <div id="asset-drawer-overlay" class="asset-drawer-overlay"></div>

  <!-- json-kifu-format ライブラリ -->
  <script src="./lib/json-kifu-format.min.js"></script>
  <!-- アプリ本体 -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
